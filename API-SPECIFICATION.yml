    UpdateRestaurantStatusDto:
      type: object
      properties:
        isOpen:
          type: boolean
          example: true
          description: Open/Close restaurant
      required:
        - isOpen
    CreateMenuItemDto:
      type: object
      properties:
        name:
          type: string
          example: Butter Chicken
          description: Menu item name
        description:
          type: string
          example: Tender chicken in rich tomato and butter sauce
          description: Item description
        price:
          type: number
          example: 350
          description: Price in INR
        category:
          type: string
          example: Main Course
          description: Category of the item
        isAvailable:
          type: boolean
          example: true
          description: Is item available
        isVegetarian:
          type: boolean
          example: true
          description: Is item vegetarian
        isVegan:
          type: boolean
          example: false
          description: Is item vegan
        imageUrl:
          type: string
          example: "https://example.com/butter-chicken.jpg"
          description: Item image URL
        preparationTimeMins:
          type: number
          example: 20
          description: Preparation time in minutes
      required:
        - name
        - price
        - category
    UpdateMenuItemDto:
      type: object
      properties:
        name:
          type: string
          example: Butter Chicken
          description: Menu item name
        description:
          type: string
          example: Tender chicken in rich tomato and butter sauce
          description: Item description
        price:
          type: number
          example: 350
          description: Price in INR
        category:
          type: string
          example: Main Course
          description: Category of the item
        isAvailable:
          type: boolean
          example: true
          description: Is item available
        isVegetarian:
          type: boolean
          example: true
          description: Is item vegetarian
        isVegan:
          type: boolean
          example: false
          description: Is item vegan
        imageUrl:
          type: string
          example: "https://example.com/butter-chicken.jpg"
          description: Item image URL
        preparationTimeMins:
          type: number
          example: 20
          description: Preparation time in minutes
    OrderItemDto:
      type: object
      properties:
        menuItemId:
          type: string
          example: uuid-of-menu-item
        quantity:
          type: number
          example: 2
          minimum: 1
        specialInstructions:
          type: string
          example: No onions please
          maxLength: 500
      required:
        - menuItemId
        - quantity
    CreateOrderDto:
      type: object
      properties:
        restaurantId:
          type: string
          example: uuid-of-restaurant
        deliveryAddressId:
          type: string
          example: uuid-of-delivery-address
        items:
          example:
            -
              menuItemId: uuid
              quantity: 2
              specialInstructions: Extra spicy
          type: array
          items:
            $ref: "#/components/schemas/OrderItemDto"
        paymentMethod:
          type: string
          enum:
            - CASH
            - CARD
            - UPI
            - WALLET
          example: CARD
        specialInstructions:
          type: string
          example: Please ring the doorbell
          maxLength: 1000
        promoCode:
          type: string
          example: WELCOME10
          maxLength: 50
      required:
        - restaurantId
        - deliveryAddressId
        - items
        - paymentMethod
    CancelOrderDto:
      type: object
      properties:
        reason:
          type: string
          example: Changed my mind
          maxLength: 500
    CreateDriverDto:
      type: object
      properties:
        licenseNumber:
          type: string
          description: Driver license number
          example: DL-1234567890123
        vehicleType:
          type: string
          description: Vehicle type
          enum:
            - BIKE
            - SCOOTER
            - CAR
          example: BIKE
        vehicleNumber:
          type: string
          description: Vehicle registration number
          example: KA-01-AB-1234
        vehicleModel:
          type: string
          description: Vehicle model name
          example: Honda Activa 6G
      required:
        - licenseNumber
        - vehicleType
        - vehicleNumber
    UpdateDriverDto:
      type: object
      properties:
        licenseNumber:
          type: string
          description: Driver license number
          example: DL-1234567890123
        vehicleType:
          type: string
          description: Vehicle type
          enum:
            - BIKE
            - SCOOTER
            - CAR
          example: BIKE
        vehicleNumber:
          type: string
          description: Vehicle registration number
          example: KA-01-AB-1234
        vehicleModel:
          type: string
          description: Vehicle model name
          example: Honda Activa 6G
    UpdateDriverStatusDto:
      type: object
      properties:
        isOnline:
          type: boolean
          description: Driver online status
          example: true
      required:
        - isOnline
    UpdateDriverLocationDto:
      type: object
      properties:
        latitude:
          type: number
          description: Latitude
          example: 12.9716
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Longitude
          example: 77.5946
          minimum: -180
          maximum: 180
      required:
        - latitude
        - longitude
    UpdateLocationDto:
      type: object
      properties:
        latitude:
          type: number
          description: Latitude
          example: 12.9716
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Longitude
          example: 77.5946
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          description: GPS accuracy in meters
          example: 10
        heading:
          type: number
          description: Heading/bearing in degrees
          example: 180
        speed:
          type: number
          description: Speed in km/h
          example: 25
      required:
        - latitude
        - longitude
