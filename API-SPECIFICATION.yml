          schema:
            type: string
      responses:
        200:
          description: Delivery marked as completed
        400:
          description: Invalid status transition
        403:
          description: Delivery not assigned to this driver
      tags:
        - Delivery (Driver)
      security:
        -
          JWT-auth: []
  /api/v1/driver/profile:
    post:
      operationId: DriverController_createProfile
      summary: Create driver profile
      parameters: []
      requestBody:
        required: true
        content:
