          example: Mumbai
          description: City name
        state:
          type: string
          example: Maharashtra
          description: State name
        postalCode:
          type: string
          example: 400001
          description: Postal code
        latitude:
          type: number
          example: 19.076
          description: Latitude (-90 to 90)
        longitude:
          type: number
