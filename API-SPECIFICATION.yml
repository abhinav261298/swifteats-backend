      operationId: LocationController_getCurrentLocation
      summary: Get driver current location
      parameters: []
      responses:
        200:
          description: Current location retrieved
        404:
          description: Location not available
      tags:
        - Location (Driver)
      security:
        -
          JWT-auth: []
  /api/v1/driver/location/stats:
    get:
      operationId: LocationController_getBufferStats
      summary: Get location buffer statistics
      parameters: []
      responses:
        200:
          description: Buffer statistics retrieved
      tags:
        - Location (Driver)
      security:
        -
          JWT-auth: []
info:
  title: SwiftEats API
  description: Real-Time Food Delivery Platform API
  version: 1.0
  contact:
tags:
  -
    name: auth
    description: Authentication endpoints
  -
    name: users
    description: User management endpoints
  -
    name: restaurants
    description: Restaurant endpoints
  -
    name: orders
    description: Order management endpoints
  -
    name: drivers
    description: Driver endpoints
  -
    name: deliveries
    description: Delivery endpoints
  -
    name: admin
    description: Admin endpoints
servers: []
components:
  securitySchemes:
    JWT-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: JWT
      description: Enter JWT token
      in: header
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: Password123!
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: +919876543210
        role:
          type: string
          enum:
            - CUSTOMER
            - RESTAURANT
            - DRIVER
            - ADMIN
          example: CUSTOMER
      required:
        - email
        - password
        - name
        - phone
        - role
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - CUSTOMER
            - RESTAURANT
            - DRIVER
            - ADMIN
        isActive:
          type: boolean
        createdAt:
          format: date-time
          type: string
        lastLoginAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - name
        - phone
        - role
        - isActive
        - createdAt
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserResponseDto"
        expiresIn:
          type: number
      required:
        - accessToken
        - user
        - expiresIn
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: abhinav.kumar@talentica.com
        password:
          type: string
          example: Password123!
      required:
        - email
        - password
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: +919876543210
    AddressResponseDto:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        deliveryInstructions:
          type: string
        isDefault:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - userId
        - label
        - street
        - city
        - state
        - postalCode
        - latitude
        - longitude
        - isDefault
        - createdAt
        - updatedAt
    CreateAddressDto:
      type: object
      properties:
        label:
          type: string
          example: Home
        street:
          type: string
          example: 123 Main Street, Apartment 4B
        city:
          type: string
          example: Mumbai
        state:
          type: string
          example: Maharashtra
        postalCode:
          type: string
          example: 400001
        latitude:
          type: number
          example: 19.076
          description: Latitude coordinate (-90 to 90)
        longitude:
          type: number
          example: 72.8777
          description: Longitude coordinate (-180 to 180)
        deliveryInstructions:
          type: string
          example: Apartment 4B, near the park
          default: null
        isDefault:
          type: boolean
          example: false
          default: false
      required:
        - label
        - street
        - city
        - state
        - postalCode
        - latitude
        - longitude
    UpdateAddressDto:
      type: object
      properties:
        label:
          type: string
          example: Home
        street:
          type: string
          example: 123 Main Street, Apartment 4B
        city:
          type: string
          example: Mumbai
        state:
