openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: AppController_getHealth
      summary: Health check endpoint
      parameters: []
      responses:
        200:
          description: 
      tags:
        - health
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      summary: Register a new user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        400:
          description: Validation error
        409:
          description: User already exists
      tags:
        - Authentication
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      summary: Login user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        401:
          description: Invalid credentials
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Logout user (invalidate session)
      parameters: []
      responses:
        204:
          description: Logout successful
        401:
          description: Unauthorized
      tags:
        - Authentication
      security:
        -
          JWT-auth: []
  /api/v1/auth/me:
    get:
      operationId: AuthController_getCurrentUser
      summary: Get current user profile
      parameters: []
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        401:
          description: Unauthorized
      tags:
        - Authentication
      security:
        -
          JWT-auth: []
  /api/v1/users/profile:
    get:
      operationId: UserController_getProfile
      summary: Get current user profile
      parameters: []
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        401:
          description: Unauthorized
        404:
          description: User not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
    patch:
      operationId: UserController_updateProfile
      summary: Update current user profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: User not found
        409:
          description: Phone number already in use
      tags:
        - Users
      security:
        -
          JWT-auth: []
  /api/v1/users/addresses:
    get:
      operationId: UserController_getAddresses
      summary: Get all addresses for current user
      parameters: []
      responses:
        200:
          description: Addresses retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponseDto"
        401:
          description: Unauthorized
        404:
          description: User not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
    post:
      operationId: UserController_createAddress
      summary: Create a new address
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressDto"
      responses:
        201:
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDto"
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: User not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
  /api/v1/users/addresses/{id}:
    patch:
      operationId: UserController_updateAddress
      summary: Update an address
      parameters:
        -
          name: id
          required: true
          in: path
          description: Address ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressDto"
      responses:
        200:
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDto"
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: Address not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
    delete:
      operationId: UserController_deleteAddress
      summary: Delete an address
      parameters:
        -
          name: id
          required: true
          in: path
          description: Address ID
          schema:
            type: string
      responses:
        204:
          description: Address deleted
        401:
          description: Unauthorized
        404:
          description: Address not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
  /api/v1/users/addresses/{id}/set-default:
    post:
      operationId: UserController_setDefaultAddress
      summary: Set an address as default
      parameters:
        -
          name: id
          required: true
          in: path
          description: Address ID
          schema:
            type: string
      responses:
        200:
          description: Default address set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponseDto"
        401:
          description: Unauthorized
        404:
          description: Address not found
      tags:
        - Users
      security:
        -
          JWT-auth: []
  /api/v1/restaurants:
    get:
      operationId: RestaurantController_findNearbyRestaurants
      summary: Browse nearby restaurants
      parameters:
        -
          name: latitude
          required: false
          in: query
          description: User latitude for distance calculation
          schema:
            example: 19.076
            type: number
        -
          name: longitude
          required: false
          in: query
          description: User longitude for distance calculation
          schema:
            example: 72.8777
            type: number
        -
          name: radius
          required: false
          in: query
          description: Radius in km
          schema:
            default: 10
            example: 5
            type: number
        -
          name: cuisineType
          required: false
          in: query
          description: Filter by cuisine type
          schema:
            example: Indian
            type: string
        -
          name: isOpen
          required: false
          in: query
          description: Filter only open restaurants
          schema:
            example: true
            type: boolean
        -
          name: search
          required: false
          in: query
          description: Search by restaurant name
          schema:
            example: pizza
            type: string
      responses:
        200:
          description: Restaurants retrieved
        401:
          description: Unauthorized
      tags:
        - Restaurants (Customer)
      security:
        -
          JWT-auth: []
  /api/v1/restaurants/{id}:
    get:
      operationId: RestaurantController_getRestaurantById
      summary: Get restaurant details
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        200:
          description: Restaurant details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurants (Customer)
      security:
        -
          JWT-auth: []
  /api/v1/restaurants/{id}/menu:
    get:
      operationId: RestaurantController_getRestaurantMenu
      summary: Get restaurant menu
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
        -
          name: category
          required: false
          in: query
          schema:
            type: string
      responses:
        200:
          description: Menu retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurants (Customer)
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/profile:
    get:
      operationId: RestaurantOwnerController_getProfile
      summary: Get own restaurant profile
      parameters: []
      responses:
        200:
          description: Restaurant profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
    post:
      operationId: RestaurantOwnerController_createProfile
      summary: Create restaurant profile (first-time setup)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantDto"
      responses:
        201:
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        401:
          description: Unauthorized
        409:
          description: Restaurant already exists
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
    patch:
      operationId: RestaurantOwnerController_updateProfile
      summary: Update restaurant profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurantDto"
      responses:
        200:
          description: Restaurant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/status:
    patch:
      operationId: RestaurantOwnerController_updateStatus
      summary: Toggle restaurant open/closed status
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurantStatusDto"
      responses:
        200:
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        401:
          description: Unauthorized
        403:
          description: Restaurant not approved or not active
        404:
          description: Restaurant not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/menu:
    get:
      operationId: RestaurantOwnerController_getMenu
      summary: Get own restaurant menu
      parameters: []
      responses:
        200:
          description: Menu retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
    post:
      operationId: RestaurantOwnerController_createMenuItem
      summary: Create menu item
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemDto"
      responses:
        201:
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        401:
          description: Unauthorized
        404:
          description: Restaurant not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/menu/{id}:
    patch:
      operationId: RestaurantOwnerController_updateMenuItem
      summary: Update menu item
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemDto"
      responses:
        200:
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        401:
          description: Unauthorized
        404:
          description: Menu item not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
    delete:
      operationId: RestaurantOwnerController_deleteMenuItem
      summary: Delete menu item
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        204:
          description: Menu item deleted
        401:
          description: Unauthorized
        404:
          description: Menu item not found
      tags:
        - Restaurant Management (Owner)
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/orders:
    get:
      operationId: RestaurantOrderController_getRestaurantOrders
      summary: Get orders for restaurant
      parameters: []
      responses:
        200:
          description: Orders retrieved successfully
      tags:
        - Restaurant Orders
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/orders/{id}/accept:
    patch:
      operationId: RestaurantOrderController_acceptOrder
      summary: Accept order and trigger driver assignment
      parameters:
        -
          name: id
          required: true
          in: path
          description: Order ID
          schema:
            type: string
      responses:
        200:
          description: Order accepted and driver assigned successfully
        400:
          description: Invalid order status
        403:
          description: Order does not belong to this restaurant
        404:
          description: Order not found
        503:
          description: No drivers available
      tags:
        - Restaurant Orders
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/orders/{id}/ready:
    patch:
      operationId: RestaurantOrderController_markOrderReady
      summary: Mark order as ready for pickup
      parameters:
        -
          name: id
          required: true
          in: path
          description: Order ID
          schema:
            type: string
      responses:
        200:
          description: Order marked as ready
        400:
          description: Invalid order status
        403:
          description: Order does not belong to this restaurant
        404:
          description: Order not found
      tags:
        - Restaurant Orders
      security:
        -
          JWT-auth: []
  /api/v1/restaurant/orders/{id}/reject:
    patch:
      operationId: RestaurantOrderController_rejectOrder
      summary: Reject order
      parameters:
        -
          name: id
          required: true
          in: path
          description: Order ID
          schema:
            type: string
      responses:
        200:
          description: Order rejected successfully
        400:
          description: Invalid order status
        403:
          description: Order does not belong to this restaurant
        404:
          description: Order not found
      tags:
        - Restaurant Orders
      security:
        -
          JWT-auth: []
  /api/v1/orders:
    post:
      operationId: OrderController_createOrder
      summary: Create a new order
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      responses:
        201:
          description: Order created successfully
        400:
          description: Invalid request or restaurant closed
        404:
          description: Restaurant or menu items not found
      tags:
        - Orders
      security:
        -
          JWT-auth: []
    get:
      operationId: OrderController_getOrderHistory
      summary: Get order history
      parameters:
        -
          name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        -
          name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 10
            example: 10
            type: number
        -
          name: status
          required: false
          in: query
          schema:
            enum:
              - PENDING
              - DELIVERED
              - CANCELLED
            type: string
      responses:
        200:
          description: Order history retrieved
      tags:
        - Orders
      security:
        -
          JWT-auth: []
  /api/v1/orders/{id}:
    get:
      operationId: OrderController_getOrderById
      summary: Get order details by ID (includes payment info)
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        200:
          description: Order details retrieved
        404:
          description: Order not found
      tags:
        - Orders
      security:
        -
          JWT-auth: []
  /api/v1/orders/{id}/cancel:
    patch:
      operationId: OrderController_cancelOrder
      summary: Cancel an order (within 1 minute of creation)
      parameters:
        -
          name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderDto"
      responses:
        200:
          description: Order cancelled successfully
        400:
          description: Cancellation window expired or invalid status
        404:
          description: Order not found
      tags:
        - Orders
      security:
        -
          JWT-auth: []
  /api/v1/driver/deliveries/active:
