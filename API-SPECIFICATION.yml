          name: id
          required: true
          in: path
          description: Delivery ID
          schema:
            type: string
      responses:
        200:
          description: Delivery accepted successfully
        400:
          description: Invalid status or already accepted
        403:
          description: Delivery not assigned to this driver
      tags:
        - Delivery (Driver)
      security:
        -
          JWT-auth: []
  /api/v1/driver/deliveries/{id}/arrived-restaurant:
    patch:
      operationId: DeliveryController_arrivedAtRestaurant
      summary: Mark arrived at restaurant
      parameters:
        -
          name: id
          required: true
          in: path
          description: Delivery ID
          schema:
            type: string
      responses:
        200:
          description: Arrival at restaurant marked
        400:
          description: Invalid status transition
        403:
          description: Delivery not assigned to this driver
      tags:
        - Delivery (Driver)
      security:
        -
          JWT-auth: []
  /api/v1/driver/deliveries/{id}/picked-up:
    patch:
      operationId: DeliveryController_pickedUp
      summary: Mark order picked up from restaurant
      parameters:
        -
          name: id
          required: true
          in: path
          description: Delivery ID
          schema:
            type: string
      responses:
        200:
          description: Order picked up marked
        400:
          description: Invalid status transition
        403:
          description: Delivery not assigned to this driver
      tags:
        - Delivery (Driver)
      security:
        -
          JWT-auth: []
  /api/v1/driver/deliveries/{id}/arrived-customer:
    patch:
      operationId: DeliveryController_arrivedAtCustomer
      summary: Mark arrived at customer location
      parameters:
        -
          name: id
