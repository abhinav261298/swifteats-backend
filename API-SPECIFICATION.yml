      security:
        -
          JWT-auth: []
  /api/v1/driver/deliveries:
    get:
      operationId: DeliveryController_getDeliveryHistory
      summary: Get driver's delivery history
      parameters:
        -
          name: limit
          required: false
          in: query
          description: "Number of deliveries to retrieve (default: 20)"
