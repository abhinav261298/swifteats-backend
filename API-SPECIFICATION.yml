      parameters: []
      responses:
        200:
          description: Driver profile retrieved
        404:
          description: Driver profile not found
      tags:
        - Driver
      security:
        -
          JWT-auth: []
    patch:
      operationId: DriverController_updateProfile
      summary: Update driver profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverDto"
      responses:
        200:
          description: Driver profile updated successfully
        400:
          description: Invalid data
        404:
          description: Driver profile not found
      tags:
        - Driver
      security:
        -
          JWT-auth: []
  /api/v1/driver/status:
    patch:
      operationId: DriverController_updateStatus
      summary: Toggle driver online/offline status
      parameters: []
      requestBody:
        required: true
        content:
