services:
  # PostgreSQL Database with PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: swifteats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swifteats
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"  # Changed to 5433 on host to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swifteats-network

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: swifteats-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@swifteats.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - swifteats-network

  # Main NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swifteats-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: swifteats_user
      DB_PASSWORD: secure_password
      DB_NAME: swifteats
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: 'false'
      
      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 5m
      
      # Cache
      CACHE_TTL: 300
      CACHE_MAX: 1000
      
      # Logging
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swifteats-network
    volumes:
      - ./logs:/app/logs

  # GPS Simulator
  gps-simulator:
    build:
      context: ./gps-simulator
      dockerfile: Dockerfile
    container_name: swifteats-gps-simulator
    restart: unless-stopped
    environment:
      API_URL: http://app:4000/api/v1
      DRIVER_COUNT: 50
      UPDATE_INTERVAL_MS: 100
      CENTER_LAT: 19.0760
      CENTER_LNG: 72.8777
      RADIUS_KM: 10
      MAX_SPEED_KMH: 40
      MIN_SPEED_KMH: 10
      
      # You need to provide driver tokens here after creating drivers
      # Get tokens by logging in as drivers from the main app
      DRIVER_TOKENS: ${DRIVER_TOKENS:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - swifteats-network
    profiles:
      - simulator  # Only start with: docker-compose --profile simulator up

networks:
  swifteats-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
