<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftEats - Customer Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Logs Panel */
        .logs-panel {
            width: 400px;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-left: 2px solid #667eea;
        }

        .logs-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }

        .log-entry.error {
            border-left-color: #ff4444;
            color: #ff4444;
        }

        .log-entry.success {
            border-left-color: #00ff88;
            color: #00ff88;
        }

        .log-entry.info {
            border-left-color: #4488ff;
            color: #4488ff;
        }

        .log-timestamp {
            color: #888;
            font-size: 10px;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Login Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Restaurant Grid */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .restaurant-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .restaurant-card.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .restaurant-name {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .restaurant-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .restaurant-distance {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        /* Menu Items */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .menu-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid transparent;
        }

        .menu-item-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .menu-item-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .menu-item-price {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            padding: 5px 12px;
            font-size: 18px;
            min-width: 35px;
        }

        .quantity-display {
            font-weight: 600;
            font-size: 16px;
            min-width: 30px;
            text-align: center;
        }

        /* Cart */
        .cart-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .cart-total {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
        }

        /* Order Tracking */
        .order-status {
            margin-top: 20px;
        }

        .status-timeline {
            position: relative;
            padding-left: 40px;
        }

        .status-item {
            position: relative;
            padding: 15px 0;
        }

        .status-item::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 20px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e0e0e0;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #e0e0e0;
        }

        .status-item.completed::before {
            background: #4caf50;
            box-shadow: 0 0 0 2px #4caf50;
        }

        .status-item.active::before {
            background: #667eea;
            box-shadow: 0 0 0 2px #667eea;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        .status-item::after {
            content: '';
            position: absolute;
            left: -23px;
            top: 36px;
            width: 2px;
            height: calc(100% - 16px);
            background: #e0e0e0;
        }

        .status-item:last-child::after {
            display: none;
        }

        .status-item.completed::after {
            background: #4caf50;
        }

        .status-title {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .status-time {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        /* Alert/Info Box */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .alert.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .alert.warning {
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #ff9800;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* User Info Bar */
        .user-info {
            background: white;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }

        .logout-btn {
            padding: 8px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Content -->
        <div class="main-content">
            <!-- Login Screen -->
            <div id="loginScreen" class="card">
                <h2>🍕 SwiftEats Customer Login</h2>
                <div class="alert info">
                    <strong>Demo Credentials:</strong><br>
                    Email: customer1@example.com<br>
                    Password: Password123!
                </div>
                <form class="login-form" onsubmit="login(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" value="customer1@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" value="Password123!" required>
                    </div>
                    <button type="submit" id="loginBtn">Login</button>
                </form>
            </div>

            <!-- User Info (hidden initially) -->
            <div id="userInfo" class="user-info hidden">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div>
                        <div style="font-weight: 600; font-size: 18px; color: #333;" id="userName"></div>
                        <div style="font-size: 14px; color: #666;" id="userEmail"></div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Restaurant Selection -->
            <div id="restaurantScreen" class="card hidden">
                <h2>🍽️ Browse Restaurants Near You</h2>
                <div class="alert info">
                    Showing restaurants within 5km radius (sorted by distance)
                </div>
                <div id="restaurantGrid" class="restaurant-grid"></div>
                <button onclick="proceedToMenu()" id="selectRestaurantBtn" disabled style="margin-top: 20px;">
                    View Menu
                </button>
            </div>

            <!-- Menu Selection -->
            <div id="menuScreen" class="card hidden">
                <h2 id="restaurantTitle">📋 Menu</h2>
                <div class="menu-grid" id="menuGrid"></div>
                
                <div class="cart-summary" id="cartSummary">
                    <h3>🛒 Your Cart</h3>
                    <div id="cartItems"></div>
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cartTotal">₹0.00</span>
                    </div>
                    <button onclick="proceedToCheckout()" id="checkoutBtn" disabled style="margin-top: 15px; width: 100%;">
                        Place Order
                    </button>
                </div>
            </div>

            <!-- Order Tracking -->
            <div id="trackingScreen" class="card hidden">
                <h2>🚚 Order Tracking</h2>
                <div class="alert success">
                    Order placed successfully! Order ID: <strong id="orderIdDisplay"></strong>
                </div>
                
                <div class="order-status">
                    <div class="status-timeline" id="statusTimeline"></div>
                </div>

                <div style="margin-top: 30px;">
                    <button onclick="startNewOrder()" style="width: 100%;">Place Another Order</button>
                </div>
            </div>
        </div>

        <!-- Logs Panel -->
        <div class="logs-panel">
            <h3>📋 System Logs</h3>
            <div id="logsContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:4000/api/v1';
        let authToken = null;
        let currentUser = null;
        let selectedRestaurant = null;
        let cart = {};
        let currentOrder = null;

        // Logging function
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logsContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `
                <div class="log-timestamp">[${timestamp}]</div>
                <div>${message}</div>
            `;
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
            
            // Keep only last 50 logs
            while (logsContainer.children.length > 50) {
                logsContainer.removeChild(logsContainer.lastChild);
            }
        }

        // Login
        async function login(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            addLog('Attempting login...', 'info');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error?.message || 'Login failed');
                }

                // API wraps response in { success, data, timestamp }
                const data = result.data || result;
                authToken = data.accessToken;
                currentUser = data.user;

                addLog(`✓ Login successful: ${currentUser.name}`, 'success');
                addLog(`JWT Token generated (expires in ${data.expiresIn}s)`, 'success');
                
                showUserInfo();
                await loadRestaurants();

            } catch (error) {
                addLog(`✗ Login failed: ${error.message}`, 'error');
                alert('Login failed: ' + error.message);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        // Show user info
        function showUserInfo() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
        }

        // Load restaurants
        async function loadRestaurants() {
            addLog('Fetching nearby restaurants...', 'info');
            document.getElementById('restaurantScreen').classList.remove('hidden');

            try {
                // Mock coordinates (Mumbai)
                const latitude = 19.0760;
                const longitude = 72.8777;
                const radius = 20; // 20km to include both seeded restaurants

                const response = await fetch(
                    `${API_BASE}/restaurants?latitude=${latitude}&longitude=${longitude}&radius=${radius}`,
                    {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    }
                );

                const result = await response.json();
                let restaurants = result.data || result;
                
                // Handle different response structures
                if (!Array.isArray(restaurants)) {
                    // Might be paginated or have items property
                    restaurants = restaurants.items || restaurants.restaurants || [];
                }
                
                addLog(`✓ Found ${restaurants.length} restaurants nearby`, 'success');
                addLog('Using PostGIS spatial queries for nearest search', 'info');

                const grid = document.getElementById('restaurantGrid');
                grid.innerHTML = '';

                if (restaurants.length === 0) {
                    grid.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No restaurants found nearby</div>';
                    return;
                }

                restaurants.forEach(restaurant => {
                    const card = document.createElement('div');
                    card.className = 'restaurant-card';
                    card.onclick = () => selectRestaurant(restaurant, card);
                    card.innerHTML = `
                        <div class="restaurant-name">${restaurant.name}</div>
                        <div class="restaurant-info">📍 ${restaurant.address}</div>
                        <div class="restaurant-info">🍴 ${restaurant.cuisineType}</div>
                        <div class="restaurant-distance">📏 ${restaurant.distance ? restaurant.distance.toFixed(2) + ' km' : 'Nearby'}</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                addLog(`✗ Failed to load restaurants: ${error.message}`, 'error');
            }
        }

        // Select restaurant
        function selectRestaurant(restaurant, cardElement) {
            // Remove previous selection
            document.querySelectorAll('.restaurant-card').forEach(card => {
                card.classList.remove('selected');
            });

            cardElement.classList.add('selected');
            selectedRestaurant = restaurant;
            document.getElementById('selectRestaurantBtn').disabled = false;
            addLog(`Selected restaurant: ${restaurant.name}`, 'success');
        }

        // Proceed to menu
        async function proceedToMenu() {
            if (!selectedRestaurant) return;

            addLog('Loading menu items...', 'info');
            document.getElementById('restaurantScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('restaurantTitle').textContent = `📋 ${selectedRestaurant.name} - Menu`;

            try {
                const response = await fetch(
                    `${API_BASE}/restaurants/${selectedRestaurant.id}/menu`,
                    {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    }
                );

                const result = await response.json();
                const menuItems = result.data || result;
                addLog(`✓ Loaded ${menuItems.length} menu items`, 'success');
                addLog('Menu data served from in-memory cache (5min TTL)', 'info');

                const grid = document.getElementById('menuGrid');
                grid.innerHTML = '';

                menuItems.forEach(item => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'menu-item';
                    
                    // Convert price to number (API returns it as string)
                    const price = parseFloat(item.price);
                    
                    itemCard.innerHTML = `
                        <div class="menu-item-name">${item.name}</div>
                        <div class="menu-item-description">${item.description || ''}</div>
                        <div class="menu-item-price">₹${price.toFixed(2)}</div>
                        <div class="quantity-controls">
                            <button onclick="updateQuantity('${item.id}', -1)">−</button>
                            <span class="quantity-display" id="qty-${item.id}">0</span>
                            <button onclick="updateQuantity('${item.id}', 1)">+</button>
                        </div>
                    `;
                    grid.appendChild(itemCard);

                    // Store menu item details with numeric price
                    if (!cart[item.id]) {
                        cart[item.id] = { ...item, price: price, quantity: 0 };
                    }
                });

            } catch (error) {
                addLog(`✗ Failed to load menu: ${error.message}`, 'error');
            }
        }

        // Update quantity
        function updateQuantity(itemId, change) {
            if (!cart[itemId]) return;

            cart[itemId].quantity = Math.max(0, cart[itemId].quantity + change);
            document.getElementById(`qty-${itemId}`).textContent = cart[itemId].quantity;

            updateCartSummary();
            addLog(`Updated cart: ${cart[itemId].name} x${cart[itemId].quantity}`, 'info');
        }

        // Update cart summary
        function updateCartSummary() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');
            
            cartItemsDiv.innerHTML = '';
            let total = 0;
            let itemCount = 0;

            Object.values(cart).forEach(item => {
                if (item.quantity > 0) {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    itemCount++;

                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <span>${item.name} x${item.quantity}</span>
                        <span>₹${itemTotal.toFixed(2)}</span>
                    `;
                    cartItemsDiv.appendChild(cartItem);
                }
            });

            // Add delivery fee and GST
            const deliveryFee = 40;
            const gst = total * 0.05;
            const grandTotal = total + deliveryFee + gst;

            if (itemCount > 0) {
                const feeItem = document.createElement('div');
                feeItem.className = 'cart-item';
                feeItem.innerHTML = `<span>Delivery Fee</span><span>₹${deliveryFee.toFixed(2)}</span>`;
                cartItemsDiv.appendChild(feeItem);

                const gstItem = document.createElement('div');
                gstItem.className = 'cart-item';
                gstItem.innerHTML = `<span>GST (5%)</span><span>₹${gst.toFixed(2)}</span>`;
                cartItemsDiv.appendChild(gstItem);
            }

            cartTotalDiv.textContent = `₹${grandTotal.toFixed(2)}`;
            document.getElementById('checkoutBtn').disabled = itemCount === 0;
        }

        // Proceed to checkout
        async function proceedToCheckout() {
            const orderItems = Object.values(cart)
                .filter(item => item.quantity > 0)
                .map(item => ({
                    menuItemId: item.id,
                    quantity: item.quantity,
                    specialInstructions: ''
                }));

            if (orderItems.length === 0) return;

            addLog('Placing order...', 'info');
            document.getElementById('checkoutBtn').disabled = true;
            document.getElementById('checkoutBtn').textContent = 'Processing...';

            try {
                // Get user's first address
                const addressResponse = await fetch(`${API_BASE}/users/addresses`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const addressResult = await addressResponse.json();
                const addresses = addressResult.data || addressResult;
                
                if (addresses.length === 0) {
                    throw new Error('No delivery address found');
                }

                const defaultAddress = addresses.find(a => a.isDefault) || addresses[0];
                addLog(`Using delivery address: ${defaultAddress.street}`, 'info');

                // Place order
                const orderResponse = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        restaurantId: selectedRestaurant.id,
                        deliveryAddressId: defaultAddress.id,
                        items: orderItems,
                        paymentMethod: 'UPI'
                    })
                });

                const orderResult = await orderResponse.json();
                const order = orderResult.data || orderResult;
                currentOrder = order;

                addLog('✓ Order validated and created', 'success');
                addLog('✓ Payment processed (Mock Gateway)', 'success');
                addLog('✓ Driver assignment algorithm triggered', 'success');
                addLog('Using PostGIS nearest-driver spatial query', 'info');

                // Clear cart after successful order
                Object.keys(cart).forEach(itemId => {
                    cart[itemId].quantity = 0;
                    const qtyDisplay = document.getElementById(`qty-${itemId}`);
                    if (qtyDisplay) qtyDisplay.textContent = '0';
                });
                cart = {};
                updateCartSummary();

                document.getElementById('menuScreen').classList.add('hidden');
                await showOrderTracking(order);

            } catch (error) {
                addLog(`✗ Order placement failed: ${error.message}`, 'error');
                alert('Order failed: ' + error.message);
                document.getElementById('checkoutBtn').disabled = false;
                document.getElementById('checkoutBtn').textContent = 'Place Order';
            }
        }

        // Show order tracking
        async function showOrderTracking(order) {
            document.getElementById('trackingScreen').classList.remove('hidden');
            document.getElementById('orderIdDisplay').textContent = order.id;

            addLog(`Order ${order.id} is being tracked`, 'success');

            // Simulate order status updates
            const statuses = [
                { status: 'PENDING', title: 'Order Placed', delay: 0 },
                { status: 'CONFIRMED', title: 'Restaurant Confirmed', delay: 2000 },
                { status: 'PREPARING', title: 'Food is Being Prepared', delay: 5000 },
                { status: 'READY_FOR_PICKUP', title: 'Ready for Pickup', delay: 8000 },
                { status: 'PICKED_UP', title: 'Driver Picked Up Order', delay: 10000 },
                { status: 'OUT_FOR_DELIVERY', title: 'Out for Delivery', delay: 12000 },
                { status: 'DELIVERED', title: 'Order Delivered', delay: 15000 }
            ];

            updateStatusTimeline(statuses, 0);

            // Simulate status progression
            statuses.forEach((statusObj, index) => {
                setTimeout(() => {
                    updateStatusTimeline(statuses, index);
                    addLog(`Order status: ${statusObj.title}`, 'success');
                    
                    if (index === 1) {
                        addLog('Restaurant accepted order', 'info');
                    } else if (index === 2) {
                        addLog('Estimated prep time: 20 minutes', 'info');
                    } else if (index === 4) {
                        addLog('Driver: Raj Kumar (★4.8)', 'info');
                        addLog('Vehicle: Bike (MH01AB1234)', 'info');
                        addLog('GPS tracking initiated via WebSocket', 'info');
                    } else if (index === 5) {
                        addLog('Real-time location updates streaming', 'info');
                        addLog('ETA: 15 minutes', 'info');
                    } else if (index === 6) {
                        addLog('✓ Order delivered successfully!', 'success');
                    }
                }, statusObj.delay);
            });
        }

        // Update status timeline
        function updateStatusTimeline(statuses, currentIndex) {
            const timeline = document.getElementById('statusTimeline');
            timeline.innerHTML = '';

            statuses.forEach((statusObj, index) => {
                const statusItem = document.createElement('div');
                statusItem.className = 'status-item';
                
                if (index < currentIndex) {
                    statusItem.classList.add('completed');
                } else if (index === currentIndex) {
                    statusItem.classList.add('active');
                }

                const time = index <= currentIndex ? new Date().toLocaleTimeString() : '';

                statusItem.innerHTML = `
                    <div class="status-title">${statusObj.title}</div>
                    <div class="status-time">${time}</div>
                `;
                timeline.appendChild(statusItem);
            });
        }

        // Start new order
        function startNewOrder() {
            cart = {};
            selectedRestaurant = null;
            currentOrder = null;

            document.getElementById('trackingScreen').classList.add('hidden');
            document.getElementById('restaurantScreen').classList.remove('hidden');
            
            addLog('Starting new order flow', 'info');
            loadRestaurants();
        }

        // Logout
        function logout() {
            addLog('Logging out...', 'info');
            
            fetch(`${API_BASE}/auth/logout`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` }
            }).finally(() => {
                authToken = null;
                currentUser = null;
                selectedRestaurant = null;
                cart = {};
                currentOrder = null;

                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('restaurantScreen').classList.add('hidden');
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('trackingScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');

                addLog('✓ Logged out successfully', 'success');
            });
        }

        // Initialize
        addLog('SwiftEats Demo UI initialized', 'success');
        addLog('Backend API: http://localhost:4000', 'info');
        addLog('Ready for customer login', 'info');
    </script>
</body>
</html>
